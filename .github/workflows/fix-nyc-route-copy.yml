name: Fix NYC route explorer copy
on:
  push:
    branches:
      - feature/nyc-route-explorer-20261013
    paths:
      - .github/workflows/fix-nyc-route-copy.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nyc-route-explorer-20261013
          fetch-depth: 0
      - name: Fix copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('new-york-city-tour-bus.html')
          s=p.read_text().replace('노선 · 인티랙티브 노선도','노선 · 인터랙티브 노선도')
          p.write_text(s)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-nyc-route-copy.yml
      - name: Commit changes
        run: |
          git config user.name "citytourbus-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-york-city-tour-bus.html .github/workflows/fix-nyc-route-copy.yml
          git commit -m "Fix NYC route explorer copy"
          git push origin HEAD:feature/nyc-route-explorer-20261013