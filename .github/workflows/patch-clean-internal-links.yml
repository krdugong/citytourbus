name: Patch clean internal city links
on:
  push:
    branches:
      - 'fix/trust-seo-20261013'
    paths:
      - '.github/workflows/patch-clean-internal-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/trust-seo-20261013'
      - name: Prefer clean URLs in homepage and compare UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-v2.html')
          s=p.read_text()
          old="function href(slug){return slug==='new-york'?'/new-york-city-tour-bus':'/compare?city='+slug}"
          new="function href(slug){const clean=['paris','london','rome','barcelona','dubai','berlin','madrid','sydney'];return slug==='new-york'?'/new-york-city-tour-bus':clean.includes(slug)?'/'+slug+'-city-tour-bus':'/compare?city='+slug}"
          if old not in s:
              raise SystemExit('homepage href function not found')
          p.write_text(s.replace(old,new,1))

          p=Path('compare.html')
          s=p.read_text()
          old="try{history.replaceState(null,'',`/compare?city=${k}`);}catch(e){}"
          new="try{const clean=['paris','london','rome','barcelona','dubai','berlin','madrid','sydney'];history.replaceState(null,'',clean.includes(k)?`/${k}-city-tour-bus`:`/compare?city=${k}`);}catch(e){}"
          if old not in s:
              raise SystemExit('compare history function not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit link changes
        run: |
          git config user.name "citytourbus-fix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-v2.html compare.html
          git commit -m "Prefer clean internal URLs for priority cities"
          git push origin HEAD:fix/trust-seo-20261013
