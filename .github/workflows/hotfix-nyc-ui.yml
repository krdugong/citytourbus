name: Hotfix NYC UI

on:
  push:
    branches: [hotfix/nyc-ui-20261013]
    paths: ['.github/workflows/hotfix-nyc-ui.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/nyc-ui-20261013
          fetch-depth: 0
      - name: Patch homepage and NYC page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index-v2.html')
          s = p.read_text()
          s = s.replace('<span class="line">전 세계 시티투어버스를</span>', '<span class="line">전 세계 <span class="nowrap-word">시티투어버스를</span></span>', 1)
          if '.nowrap-word{white-space:nowrap}' not in s:
              s = s.replace('.hero h1 .subline{display:block;color:var(--sub);white-space:nowrap}', '.hero h1 .subline{display:block;color:var(--sub);white-space:nowrap}.nowrap-word{white-space:nowrap}', 1)
          p.write_text(s)

          p = Path('new-york-city-tour-bus.html')
          s = p.read_text()
          if '/nyc-redesign.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="/nyc-redesign.css?v=20261013">\n</head>', 1)
          s = s.replace('<span class="l4">.COM</span>', '<span class="l4">.KR</span>')
          p.write_text(s)
          PY
          git config user.name 'citytourbus-ui-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix-nyc-ui.yml
          git add index-v2.html new-york-city-tour-bus.html nyc-redesign.css
          git commit -m 'Unify NYC page design and prevent Korean word splitting'
          git push origin hotfix/nyc-ui-20261013
