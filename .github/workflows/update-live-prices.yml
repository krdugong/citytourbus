name: Update live tour prices

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"
    - cron: "20 15 * * *"
  push:
    branches:
      - audit/affiliate-seo-20261012
    paths:
      - "scripts/update_prices.py"
      - "data/price-sources.json"
      - "data/city-sightseeing-stack.json"
      - ".github/workflows/update-live-prices.yml"

permissions:
  contents: write

concurrency:
  group: citytourbus-live-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Scrape official operator pages
        run: python scripts/update_prices.py

      - name: Validate generated JSON
        run: python -m json.tool prices.json >/dev/null

      - name: Commit changed prices
        run: |
          if [ -z "$(git status --porcelain -- prices.json)" ]; then
            echo "No price changes"
            exit 0
          fi
          git config user.name "citytourbus-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "chore: refresh official tour prices"
          git push
