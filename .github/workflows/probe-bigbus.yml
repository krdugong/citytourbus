name: Probe Big Bus response

on:
  push:
    branches:
      - audit/affiliate-seo-20261012
    paths:
      - "api/bigbus-probe.js"
      - ".github/workflows/probe-bigbus.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for branch deployment
        run: sleep 30
      - name: Call Vercel Big Bus probe
        run: |
          curl --fail-with-body --max-time 60 -sS \
            "https://citytourbus-git-audit-affili-ed1c6c-amazondewook-3299s-projects.vercel.app/api/bigbus-probe?ts=$(date +%s)"
