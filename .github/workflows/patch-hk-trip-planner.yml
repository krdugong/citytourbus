name: Patch Hong Kong attraction-first planner
on:
  push:
    branches:
      - feature/hong-kong-route-map-20261018
    paths:
      - .github/workflows/patch-hk-trip-planner.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hong-kong-route-map-20261018
          fetch-depth: 0
      - name: Patch prototype
        run: python scripts/patch_hk_trip_planner.py
      - name: Remove temporary patch files
        run: rm .github/workflows/patch-hk-trip-planner.yml scripts/patch_hk_trip_planner.py
      - name: Commit
        run: |
          git config user.name "citytourbus-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hong-kong-route-prototype.html .github/workflows/patch-hk-trip-planner.yml scripts/patch_hk_trip_planner.py
          git commit -m "Make Hong Kong route map attraction-first"
          git push origin HEAD:feature/hong-kong-route-map-20261018
