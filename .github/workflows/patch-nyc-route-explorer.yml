name: Patch NYC route explorer
on:
  push:
    branches:
      - feature/nyc-route-explorer-20261013
    paths:
      - .github/workflows/patch-nyc-route-explorer.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nyc-route-explorer-20261013
          fetch-depth: 0
      - name: Patch page
        env:
          ROUTE_SECTION_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re, base64
          p=Path('new-york-city-tour-bus.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="/nyc-route-explorer.css?v=20261013a">'
          js='<script src="/nyc-route-explorer.js?v=20261013a" defer></script>'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>', 1)
          if js not in s:
              s=s.replace('</body>', js+'\n</body>', 1)
          new_section=base64.b64decode(os.environ['ROUTE_SECTION_B64']).decode()
          s2,n=re.subn(r'  <section id="route">.*?</section>',new_section,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'route section replacement count={n}')
          p.write_text(s2)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/patch-nyc-route-explorer.yml
      - name: Commit changes
        run: |
          git config user.name "citytourbus-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-york-city-tour-bus.html .github/workflows/patch-nyc-route-explorer.yml
          git commit -m "Add interactive NYC Big Bus route explorer"
          git push origin HEAD:feature/nyc-route-explorer-20261013