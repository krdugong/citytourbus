name: Patch Hong Kong nearby stop finder
on:
  push:
    branches: [feature/hong-kong-route-map-20261018]
    paths: [.github/workflows/patch-hk-nearby-search.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hong-kong-route-map-20261018
          fetch-depth: 0
      - name: Patch HTML
        env:
          BLOCK_B64: 
          CSS_B64: PGxpbmsgcmVsPSJzdHlsZXNoZWV0IiBocmVmPSIvaGstbmVhcmJ5LXBsYWNlLXNlYXJjaC5jc3M/dj0yMDI2MTAxOGEiPg==
          JS_B64: PHNjcmlwdCBzcmM9Ii9oay1uZWFyYnktcGxhY2Utc2VhcmNoLmpzP3Y9MjAyNjEwMThhIj48L3NjcmlwdD4=
        run: |
          python -c 'from pathlib import Path; import os,base64; p=Path("hong-kong-route-prototype.html"); s=p.read_text(); block=base64.b64decode(os.environ["BLOCK_B64"]).decode(); css=base64.b64decode(os.environ["CSS_B64"]).decode(); js=base64.b64decode(os.environ["JS_B64"]).decode(); s=s if css in s else s.replace("</head>",css+"\n</head>",1); s=s if "placeFinderForm" in s else s.replace("<aside class=\"side\">","<aside class=\"side\">\n        "+block,1); s=s if js in s else s.replace("</body>",js+"\n</body>",1); p.write_text(s)'
          git config user.name citytourbus-ui-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hong-kong-route-prototype.html
          git commit -m "Add nearby stop search for Hong Kong places"
          git push origin HEAD:feature/hong-kong-route-map-20261018
