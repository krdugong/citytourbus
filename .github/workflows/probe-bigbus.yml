name: Probe Big Bus response

on:
  push:
    branches:
      - audit/affiliate-seo-20261012
    paths:
      - "scripts/probe_bigbus.py"
      - ".github/workflows/probe-bigbus.yml"

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_bigbus.py
