name: Clean unverified New York claims
on:
  push:
    branches: [fix/trust-seo-20261013]
    paths: [.github/workflows/clean-new-york-unverified.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trust-seo-20261013
      - name: Remove stale and unverified New York claims
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('new-york-city-tour-bus.html'); s=p.read_text()
          repl={
          '빅버스(Big Bus)는 다운타운·업타운 2개 노선 13개 정류장으로 첫 방문자에게 적합하고 크루즈·전망대 번들이 강점입니다. 탑뷰(TopView)는 시작가 $39로 더 저렴하고 정류장이 23개로 많으며 다운타운 배차가 5~20분으로 잦지만, 대부분 비환불입니다. 빅버스는 날짜 무료 변경이 가능합니다.':'Big Bus는 다운타운·업타운 2개 노선을 운영합니다. TopView 등 다른 운영사는 가격·정류장·취소 조건이 달라질 수 있으므로 현재 예약 페이지의 조건을 함께 비교하세요.',
          '빅버스 뉴욕은 24시간 Discover Ticket $62, 48시간 Essential Ticket $83부터 시작합니다. 야간투어와 크루즈가 포함된 Sizzler·Unlocked 번들은 $99입니다. 탑뷰는 $39부터 시작합니다.':'Big Bus 공식 페이지 기준 Discover 24시간 US$62, Essential 48시간 US$83, Explore 72시간 US$99부터 확인됩니다. 다른 운영사의 가격은 예약 페이지에서 현재 금액을 확인하세요.',
          '빅버스 뉴욕은 다운타운 루프(레드, 13개 정류장)와 업타운 루프(블루) 2개 노선으로 운영됩니다. 다운타운은 9:00~16:30, 약 30분 간격으로 운행합니다.':'Big Bus New York은 다운타운 레드 루프와 업타운 블루 루프 2개 노선을 운영합니다. 현재 공식 서비스 정보 기준 다운타운은 9:00~16:30, 약 30분 간격이고 업타운은 10:00~16:00, 약 60분 간격입니다.',
          '온라인 예매가 현장구매보다 저렴합니다. 특히 온라인 예매 시 할인이 적용되며, 성수기에는 좌석 확보도 보장됩니다. 모바일 티켓으로 출력 없이 바로 탑승할 수 있습니다.':'온라인 가격과 현장 가격은 날짜·재고·프로모션에 따라 달라질 수 있습니다. 방문일 기준 공식 예약 페이지의 최종 가격과 조건을 확인하세요.',
          '빅버스 Sizzler 티켓에 2시간 야간 투어가 포함됩니다. 타임스퀘어, 엠파이어스테이트빌딩 등 맨해튼의 야경을 감상할 수 있으며 크루즈 선택도 가능합니다.':'현재 Big Bus의 Essential과 Explore 티켓에는 2시간 Night Tour가 포함되며, Explore에는 Circle Line 크루즈도 포함됩니다. 포함 혜택은 예약 시점에 다시 확인하세요.',
          '<div class="hstat"><span class="hstat-v">$39~</span><span class="hstat-l">탑뷰 최저가</span></div>':'<div class="hstat"><span class="hstat-v">여러 상품</span><span class="hstat-l">탑뷰 등 함께 비교</span></div>',
          '<div class="hstat"><span class="hstat-v">2~4개</span><span class="hstat-l">노선 선택</span></div>':'<div class="hstat"><span class="hstat-v">2개 루프</span><span class="hstat-l">빅버스 공식 노선</span></div>',
          '결론부터 말하면 — <strong>처음 뉴욕에 가고, 크루즈·전망대까지 한 번에 묶고 싶다면 빅버스</strong>. <strong>가격을 아끼고, 더 자주 오는 버스로 많은 곳을 들르고 싶다면 탑뷰</strong>입니다. 운영사마다 노선과 해설 언어, 취소 조건이 다르므로 예약 전에 필요한 조건을 따로 확인하는 편이 안전합니다.':'Big Bus는 다운타운·업타운 2개 루프와 티켓별 포함 혜택이 명확한 편입니다. TopView 등 다른 운영사는 가격·노선·취소 조건이 다를 수 있으므로 같은 날짜 기준으로 현재 예약 조건을 함께 비교하세요.',
          '<tr><td><strong>시작가</strong></td><td class="bb-col">$62~ (24시간)</td><td class="tv-col">$39~</td></tr>':'<tr><td><strong>시작가</strong></td><td class="bb-col">US$62~ (Discover 24시간)</td><td class="tv-col">예약 페이지에서 현재가 확인</td></tr>',
          '<tr><td><strong>노선 수</strong></td><td>다운타운·업타운 2개</td><td>다운타운·업타운·브루클린·야간 등 더 많음</td></tr>':'<tr><td><strong>노선 수</strong></td><td>다운타운·업타운 2개</td><td>현재 상품에서 확인</td></tr>',
          '<tr><td><strong>정류장</strong></td><td>13개(다운타운)</td><td>약 23개</td></tr>':'<tr><td><strong>정류장</strong></td><td>다운타운 13개 · 업타운 별도</td><td>현재 노선도에서 확인</td></tr>',
          '<tr><td><strong>배차 간격</strong></td><td>약 30분</td><td>다운타운 5~20분 (더 잦음)</td></tr>':'<tr><td><strong>배차 간격</strong></td><td>다운타운 약 30분 · 업타운 약 60분</td><td>당일 운영정보 확인</td></tr>',
          '<tr><td><strong>날짜 변경</strong></td><td><strong>무료 변경</strong> (플렉서블)</td><td>대부분 비환불·변경 불가</td></tr>':'<tr><td><strong>변경·취소</strong></td><td>선택 티켓 조건 확인</td><td>선택 상품 조건 확인</td></tr>',
          '<tr><td><strong>번들 옵션</strong></td><td>크루즈·전망대·9/11박물관 강력</td><td>크루즈·자전거·박물관 입장</td></tr>':'<tr><td><strong>포함 혜택</strong></td><td>티켓별 Night Tour·Circle Line 등</td><td>선택 상품에서 확인</td></tr>',
          '<tr><td><strong>추천 대상</strong></td><td>첫 방문·번들 선호</td><td>가성비·짧은 일정·많은 정류장</td></tr>':'<tr><td><strong>비교 포인트</strong></td><td>공식 노선·포함 혜택</td><td>현재 가격·상품 조건</td></tr>',
          '“처음 뉴욕 + 명소 입장권까지 한 번에” → 빅버스 · “예산 절약 + 자주 오는 버스” → 탑뷰. 날짜가 바뀔 수 있으면 무료 변경되는 빅버스가 안전합니다.':'브랜드 이름보다 방문일 기준 노선, 포함 혜택, 취소 조건과 최종 결제금액을 맞춰 비교하는 것이 안전합니다.',
          '<div class="ob-r"><div class="ob-from">시작가</div><div class="ob-price">$39</div></div>':'<div class="ob-r"><div class="ob-from">현재가</div><div class="ob-price">확인</div></div>',
          '빅버스는 만 3~12세 어린이 요금이 적용되고 2세 이하는 무료(좌석 비점유 시)입니다. 탑뷰는 3세 이하 무료, 4~12세 어린이 요금입니다.':'어린이 연령 기준과 요금은 운영사·상품별로 달라질 수 있으므로 예약 단계의 연령 조건을 확인하세요.',
          '결론: <strong>온라인 예매가 거의 항상 현장구매보다 쌉니다.</strong> 길거리 판매원이나 키오스크에서 사는 것보다, 온라인 예매가 할인율이 크고 성수기 좌석도 보장됩니다. 탑뷰의 경우 온라인 예매 시 현장 대비 최대 47%까지 저렴하다고 안내합니다.':'온라인과 현장 가격은 날짜·재고·프로모션에 따라 달라질 수 있습니다. <strong>출발 전에 공식 예약 페이지의 현재 가격과 취소 조건을 확인</strong>하고 같은 조건으로 비교하는 것이 가장 안전합니다.',
          '낮 풍경과 전혀 다른 뉴욕의 야경을 보고 싶다면 야간 투어가 있습니다. 빅버스는 <strong>Sizzler 티켓</strong>에 2시간 야간 투어가 포함되며, 크루즈 선택도 가능합니다. 탑뷰도 별도 나이트 투어(논스톱)를 운영합니다.':'낮과 다른 뉴욕의 야경을 보고 싶다면 Night Tour를 확인하세요. 현재 Big Bus의 <strong>Essential과 Explore</strong>에는 2시간 Night Tour가 포함되고, Explore에는 Circle Line 크루즈도 포함됩니다. 다른 운영사의 야간 상품은 예약 페이지에서 현재 운영 여부를 확인하세요.',
          '탑뷰는 더 저렴하지만 비환불 조건과 성수기 대기가 흔합니다. 두 브랜드 모두 <strong>이른 오전 탑승</strong>이 쾌적함의 핵심입니다.':'다른 운영사도 가격과 취소 조건이 수시로 달라질 수 있습니다. 어느 브랜드든 <strong>당일 서비스 공지와 첫차 시간</strong>을 확인하면 동선을 잡기 쉽습니다.',
          '빅버스는 2개 노선·13개 정류장으로 첫 방문자와 번들(크루즈·전망대)에 강하고 날짜 무료 변경이 됩니다. 탑뷰는 $39부터로 더 저렴하고 정류장이 23개로 많으며 다운타운 배차가 5~20분으로 잦지만, 대부분 비환불입니다.':'Big Bus는 다운타운·업타운 2개 노선을 운영합니다. TopView 등 다른 운영사는 현재 가격·정류장·취소 조건을 예약 페이지에서 확인한 뒤 같은 날짜 기준으로 비교하세요.',
          '24시간 Discover $62, 48시간 Essential $83부터 시작합니다. 야간투어·크루즈가 포함된 Sizzler와 입장권 번들 Unlocked는 각각 $99입니다.':'Big Bus 공식 페이지 기준 Discover 24시간 US$62, Essential 48시간 US$83, Explore 72시간 US$99부터 확인됩니다. 가격과 포함 혜택은 예약 시점에 변동될 수 있습니다.',
          '빅버스 Sizzler 티켓에 2시간 야간 투어가 포함됩니다. 타임스퀘어·엠파이어스테이트 등 맨해튼 야경을 감상할 수 있고 크루즈 선택도 가능합니다.':'현재 Essential과 Explore 티켓에는 2시간 Night Tour가 포함되며 Explore에는 Circle Line 크루즈도 포함됩니다. 최종 포함 혜택은 예약 페이지에서 확인하세요.'
          }
          missing=[]
          for old,new in repl.items():
              if old not in s: missing.append(old[:60])
              s=s.replace(old,new)
          print('non-critical missing replacements:', missing)
          # Remove unsupported hard TopView figures if any remain in user-facing copy/FAQ.
          for bad in ['$39부터','23개로 많','5~20분','최대 47%','Sizzler 티켓','Sizzler·Unlocked']:
              if bad in s: raise SystemExit('Unverified/stale claim remains: '+bad)
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "citytourbus-fix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-york-city-tour-bus.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove unverified TopView and stale New York claims"
          git push origin HEAD:fix/trust-seo-20261013
