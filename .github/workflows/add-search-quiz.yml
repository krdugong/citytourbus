name: Apply search and quiz UI

on:
  push:
    branches: [feature/search-quiz-20261013]
    paths: ['.github/workflows/add-search-quiz.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/search-quiz-20261013
          fetch-depth: 0
      - name: Patch homepage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index-v2.html')
          s=p.read_text()
          s=s.replace(' list="opts"','')
          if 'id="suggestions"' not in s:
              s=s.replace('<datalist id="opts"></datalist>','<datalist id="opts"></datalist><div class="suggestions" id="suggestions" aria-live="polite"></div>',1)
          if '/search-quiz.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="/search-quiz.css?v=20261013">\n</head>',1)
          marker='<section class="section"><div class="sectionhd"><div><h2>도시만 정하면 혜택까지 한눈에</h2>'
          quiz='''<section class="section quizsec" id="quiz"><div class="sectionhd"><div><h2>내 여행에 시티투어버스가 잘 맞을까요?</h2><p>3가지만 골라보세요. 약 10초면 됩니다.</p></div></div><div class="quizbox"><div class="quizq" data-q="1"><div class="quiznum">1</div><div class="quizbody"><h3>누구와 여행하나요?</h3><div class="quizopts"><button type="button" data-score="2">가족·아이와</button><button type="button" data-score="2">부모님과</button><button type="button" data-score="1">커플·친구와</button><button type="button" data-score="0">혼자</button></div></div></div><div class="quizq" data-q="2"><div class="quiznum">2</div><div class="quizbody"><h3>이번 여행에서 중요한 건?</h3><div class="quizopts"><button type="button" data-score="2">첫 방문, 핵심 명소 많이 보기</button><button type="button" data-score="2">짧은 일정, 동선 단순하게</button><button type="button" data-score="1">여유롭게 구경하기</button><button type="button" data-score="0">한두 곳만 깊게 보기</button></div></div></div><div class="quizq" data-q="3"><div class="quiznum">3</div><div class="quizbody"><h3>도시 이동은 어떻게 하고 싶나요?</h3><div class="quizopts"><button type="button" data-score="2">많이 걷고 싶지 않아요</button><button type="button" data-score="2">타고 내리며 자유롭게 보고 싶어요</button><button type="button" data-score="1">대중교통과 섞어 쓰고 싶어요</button><button type="button" data-score="0">지하철·버스만으로도 괜찮아요</button></div></div></div><div class="quizresult"><div><em id="quizBadge">결과</em><h3 id="quizTitle">세 가지를 모두 선택해보세요.</h3><p id="quizText">여행 방식에 맞춰 시티투어버스를 어떻게 쓰면 좋은지 알려드릴게요.</p></div><button type="button" id="quizCta">내 도시 비교하기</button></div></div></section>'''
          if 'id="quiz"' not in s:
              s=s.replace(marker,quiz+marker,1)
          if '/search-quiz.js' not in s:
              s=s.replace('</body>','<script src="/search-quiz.js?v=20261013"></script>\n</body>',1)
          p.write_text(s)
          PY
          git config user.name 'citytourbus-ui-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-search-quiz.yml
          git add index-v2.html
          git commit -m 'Wire mobile autocomplete and trip-fit quiz'
          git push origin feature/search-quiz-20261013
