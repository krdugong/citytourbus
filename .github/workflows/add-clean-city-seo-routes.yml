name: Add clean city SEO routes
on:
  push:
    branches: [fix/trust-seo-20261013]
    paths: [.github/workflows/add-clean-city-seo-routes.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trust-seo-20261013
      - name: Add clean server-rendered city URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          cities=['paris','london','rome','barcelona','dubai','berlin','madrid','sydney']

          # API canonical: preferred clean URLs for priority cities.
          p=Path('api/compare.js'); s=p.read_text()
          anchor="const CITIES = {"
          clean="const CLEAN_PATHS = new Set(['paris','london','rome','barcelona','dubai','berlin','madrid','sydney']);\n\n"
          if 'const CLEAN_PATHS' not in s:
              s=s.replace(anchor,clean+anchor,1)
          old="""const canonical = city
      ? (slug === 'new-york' ? 'https://www.citytourbus.kr/new-york-city-tour-bus' : `https://www.citytourbus.kr/compare?city=${encodeURIComponent(slug)}`)
      : 'https://www.citytourbus.kr/compare';"""
          new="""const canonical = city
      ? (slug === 'new-york'
          ? 'https://www.citytourbus.kr/new-york-city-tour-bus'
          : (CLEAN_PATHS.has(slug)
              ? `https://www.citytourbus.kr/${slug}-city-tour-bus`
              : `https://www.citytourbus.kr/compare?city=${encodeURIComponent(slug)}`))
      : 'https://www.citytourbus.kr/compare';"""
          if old not in s: raise SystemExit('api canonical target missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Vercel: clean public routes, all served through the SSR comparison handler.
          p=Path('vercel.json'); data=json.loads(p.read_text())
          rewrites=data.get('rewrites',[])
          existing={x.get('source') for x in rewrites}
          insert_at=1 if rewrites and rewrites[0].get('source')=='/' else 0
          additions=[]
          for city in cities:
              src=f'/{city}-city-tour-bus'
              if src not in existing:
                  additions.append({'source':src,'destination':f'/api/compare?city={city}'})
          data['rewrites']=rewrites[:insert_at]+additions+rewrites[insert_at:]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          # Homepage internal links: point priority cities directly at their clean URLs.
          p=Path('index-v2.html'); s=p.read_text()
          old="function href(slug){return slug==='new-york'?'/new-york-city-tour-bus':'/compare?city='+slug}"
          new="function href(slug){const clean=['paris','london','rome','barcelona','dubai','berlin','madrid','sydney'];return slug==='new-york'?'/new-york-city-tour-bus':clean.includes(slug)?'/'+slug+'-city-tour-bus':'/compare?city='+slug}"
          if old not in s: raise SystemExit('homepage href target missing')
          s=s.replace(old,new,1); p.write_text(s)

          # Comparison UI: when a priority city is selected, keep the clean URL in the address bar.
          p=Path('compare.html'); s=p.read_text()
          old="try{history.replaceState(null,'',`/compare?city=${k}`);}catch(e){}"
          new="try{const clean=['paris','london','rome','barcelona','dubai','berlin','madrid','sydney'];history.replaceState(null,'',clean.includes(k)?`/${k}-city-tour-bus`:`/compare?city=${k}`);}catch(e){}"
          if old not in s: raise SystemExit('compare history target missing')
          s=s.replace(old,new,1); p.write_text(s)

          # Sitemap: publish preferred city URLs (New York already exists).
          p=Path('sitemap.xml'); sm=p.read_text()
          labels='\n'.join([f'''  <url>\n    <loc>https://www.citytourbus.kr/{c}-city-tour-bus</loc>\n    <lastmod>2026-10-13</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>0.8</priority>\n  </url>''' for c in cities])+'\n'
          for c in cities:
              if f'/{c}-city-tour-bus</loc>' in sm:
                  labels=labels.replace(f'''  <url>\n    <loc>https://www.citytourbus.kr/{c}-city-tour-bus</loc>\n    <lastmod>2026-10-13</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>0.8</priority>\n  </url>\n''','')
          if labels.strip(): sm=sm.replace('</urlset>',labels+'</urlset>')
          p.write_text(sm)
          PY
      - name: Commit clean city routes
        run: |
          git config user.name "citytourbus-fix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/compare.js vercel.json index-v2.html compare.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Add clean server-rendered SEO routes for priority cities"
          git push origin HEAD:fix/trust-seo-20261013
