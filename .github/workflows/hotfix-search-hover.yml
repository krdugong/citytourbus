name: Hotfix search suggestion hover

on:
  push:
    branches: [hotfix/search-hover-20261013]
    paths: ['.github/workflows/hotfix-search-hover.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/search-hover-20261013
          fetch-depth: 0
      - name: Patch suggestion styles
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('search-quiz.css')
          s = p.read_text()
          s = s.replace('.sug{width:100%;border:0;background:#fff;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;cursor:pointer;border-bottom:1px solid #f0f0f2}', '.search .sug{width:100%;border:0;background:#fff;color:var(--ink);padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;cursor:pointer;border-bottom:1px solid #f0f0f2}')
          s = s.replace('.sug:last-child{border-bottom:0}', '.search .sug:last-child{border-bottom:0}')
          s = s.replace('.sug:hover,.sug:focus{background:#f7f7f9;outline:none}', '.search .sug:hover,.search .sug:focus{background:#f5f5f7;color:var(--ink);outline:none}')
          s = s.replace('.sug b{font-size:13px}', '.search .sug b{font-size:13px;color:var(--ink)}')
          s = s.replace('.sug span{font-size:10px;color:var(--muted);white-space:nowrap}', '.search .sug span{font-size:10px;color:var(--muted);white-space:nowrap}')
          p.write_text(s)

          for name in ['index.html','index-v2.html']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('/search-quiz.css?v=20261013b', '/search-quiz.css?v=20261013c')
              p.write_text(s)
          PY
          git config user.name 'citytourbus-ui-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix-search-hover.yml
          git add search-quiz.css index.html index-v2.html
          git commit -m 'Fix search suggestion hover contrast'
          git push origin hotfix/search-hover-20261013
