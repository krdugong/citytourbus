name: Update home hero copy

on:
  push:
    branches: [copy/home-hero-20261013]
    paths: ['.github/workflows/update-home-hero-copy.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/home-hero-20261013
          fetch-depth: 0
      - name: Update hero copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index-v2.html')
          s = p.read_text()
          old = '<p class="lead"><strong>여행 도시만 고르면 됩니다.</strong> 전 세계 주요 도시의 시티투어버스를 모아 운영사와 가격, 할인 조건을 한눈에 비교할 수 있게 정리했습니다.</p>'
          new = '<p class="lead"><strong>내리고 싶은 곳에서 내리고, 다시 타고 싶은 곳에서 타세요.</strong> 전 세계 주요 도시의 홉온홉오프 시티투어버스를 한곳에서 비교하고, <strong>CITYTOURBUS 전용 10% 할인코드까지</strong> 확인하세요.</p>'
          if old not in s:
              raise SystemExit('target hero copy not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'citytourbus-copy-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-home-hero-copy.yml
          git add index-v2.html
          git commit -m 'Refine homepage hero copy for first-time visitors'
          git push origin copy/home-hero-20261013
