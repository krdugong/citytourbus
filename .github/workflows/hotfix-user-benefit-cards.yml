name: Apply user benefit card copy hotfix
on:
  push:
    branches: [hotfix/user-benefit-cards-20261013]
    paths: [.github/workflows/hotfix-user-benefit-cards.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/user-benefit-cards-20261013
      - name: Replace internal copy with customer benefits
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-v2.html')
          s=p.read_text()
          repl={
            '도시별 운영사 비교':'도시별 시티투어버스 비교',
            '같은 도시에서 City Sightseeing, Big Bus, 기타 예약 채널을 한 화면에서 확인합니다.':'같은 도시의 주요 시티투어버스를 한 화면에서 비교하고, 원하는 상품으로 바로 이동하세요.',
            '가격·프로모션 구분':'가격·할인 조건 한눈에',
            '확인 가능한 공식 가격과 프로모션을 분리해 보여주고, 조건이 불확실한 할인은 합산해서 단정하지 않습니다.':'현재 확인 가격과 프로모션 조건을 나란히 보고, 내 일정에 맞는 옵션을 빠르게 고르세요.',
            '갱신 실패도 그대로 표시':'전용 10% 할인코드',
            '가격 수집이 실패하면 미확인 값을 새 가격처럼 덮어쓰지 않고, 확인 가능한 데이터만 사용합니다.':'City Sightseeing 대상 상품은 CITYTOURBUS 전용 코드 CJTRAVEL10으로 10% 할인 혜택을 확인할 수 있습니다.'
          }
          missing=[]
          for old,new in repl.items():
            if old not in s:
              missing.append(old)
            s=s.replace(old,new)
          if missing:
            print('Missing strings:', missing)
          p.write_text(s)
          print('old internal phrase remains:', '갱신 실패도 그대로 표시' in s)
          print('new benefit phrase present:', '전용 10% 할인코드' in s)
          PY
      - name: Commit changes
        run: |
          git config user.name "citytourbus-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-v2.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace internal homepage copy with user benefits"
          git push origin HEAD:hotfix/user-benefit-cards-20261013
