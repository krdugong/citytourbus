name: Hotfix hero copy

on:
  push:
    branches: [hotfix/hero-copy-20261013]
    paths: ['.github/workflows/hotfix-hero-copy.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/hero-copy-20261013
          fetch-depth: 0
      - name: Simplify hero copy
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '전 세계 주요 도시의 홉온홉오프 시티투어버스를 한곳에서 비교하고, <strong>CITYTOURBUS 전용 10% 할인코드까지</strong> 확인하세요.'
          new = '전 세계 주요 도시의 홉온홉오프 시티투어버스를 한곳에서 비교하고, 독점할인코드까지 만나보세요.'
          for name in ['index.html','index-v2.html']:
              p = Path(name)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'target copy not found in {name}')
              p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'citytourbus-ui-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix-hero-copy.yml
          git add index.html index-v2.html
          git commit -m 'Simplify homepage discount copy'
          git push origin hotfix/hero-copy-20261013
