name: Fix homepage script guard
on:
  push:
    branches:
      - 'hotfix/home-script-20261013'
    paths:
      - '.github/workflows/fix-home-script.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'hotfix/home-script-20261013'
      - name: Remove stale datalist dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-v2.html')
          s=p.read_text()
          old="const opts=document.getElementById('opts');all.forEach(x=>{const o=document.createElement('option');o.value=x[1];o.label=x[2];opts.appendChild(o)});"
          new="const opts=document.getElementById('opts');if(opts)all.forEach(x=>{const o=document.createElement('option');o.value=x[1];o.label=x[2];opts.appendChild(o)});"
          if old not in s:
              raise SystemExit('stale datalist code not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          git config user.name "citytourbus-fix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-v2.html
          git commit -m "Guard removed homepage datalist dependency"
          git push origin HEAD:hotfix/home-script-20261013
