name: Probe City Sightseeing checkout

on:
  push:
    branches:
      - audit/affiliate-seo-20261012
    paths:
      - "scripts/probe_cs_checkout.py"
      - ".github/workflows/probe-cs-checkout.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: python scripts/probe_cs_checkout.py
