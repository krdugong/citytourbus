name: Apply user benefit card copy hotfix
on:
  push:
    branches: [hotfix/user-benefit-cards-20261013]
    paths: [.github/workflows/hotfix-user-benefit-cards.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/user-benefit-cards-20261013
      - name: Replace value cards with customer benefits
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index-v2.html')
          s=p.read_text()
          replacement='''<div class="values">
            <div class="value"><em>01</em><h3>도시별 시티투어버스 비교</h3><p>같은 도시의 주요 시티투어버스를 한 화면에서 비교하고, 원하는 상품으로 바로 이동하세요.</p></div>
            <div class="value"><em>02</em><h3>가격·할인 조건 한눈에</h3><p>현재 확인 가격과 프로모션 조건을 나란히 보고, 내 일정에 맞는 옵션을 빠르게 고르세요.</p></div>
            <div class="value"><em>03</em><h3>전용 10% 할인코드</h3><p>City Sightseeing 대상 상품은 CITYTOURBUS 전용 코드 <strong>CJTRAVEL10</strong>으로 10% 할인 혜택을 확인할 수 있습니다.</p></div>
          </div></section>'''
          pattern=r'<div class="values">.*?</div>\s*</section>'
          ns,count=re.subn(pattern,replacement,s,count=1,flags=re.S)
          print('values sections replaced:', count)
          if count != 1:
            raise SystemExit('Expected exactly one values section')
          if '갱신 실패도 그대로 표시' in ns or '가격 수집이 실패하면' in ns:
            raise SystemExit('Internal failure copy still present')
          if '전용 10% 할인코드' not in ns:
            raise SystemExit('Customer benefit copy missing')
          p.write_text(ns)
          PY
      - name: Commit changes
        run: |
          git config user.name "citytourbus-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-v2.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace homepage internal cards with customer benefits"
          git push origin HEAD:hotfix/user-benefit-cards-20261013
